name: Build and test
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -s .mvn/settings.xml verify
        env:
          RUN_DB_TESTS: 'true'
          REPLAY_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPLAY_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_USER: interfaceflow
      DB_PASSWORD: ci-disposable-database
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_DB_URL: postgresql://127.0.0.1:5432/interfaceflow
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Wait for both application health endpoints
        shell: bash
        run: |
          for port in 8080 8081; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --max-time 2 "http://127.0.0.1:$port/actuator/health" | python3 -c 'import json,sys; sys.exit(json.load(sys.stdin)["status"] != "UP")'; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then exit 1; fi
          done
      - run: npm run test:e2e
        working-directory: frontend
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-e2e-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            compose.log
      - run: docker compose down --volumes
        if: always()
