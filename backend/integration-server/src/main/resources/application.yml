server:
  port: 8080
spring:
  application:
    name: integration-server
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interfaceflow}
    username: ${DB_USER:interfaceflow}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    table: flyway_integration_history
    default-schema: integration
    create-schemas: true
mybatis:
  mapper-locations: classpath:mappers/*.xml
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: logstash
lab:
  target-url: ${TARGET_URL:http://localhost:8081}
  timeout-ms: ${TARGET_TIMEOUT_MS:3000}
  connection-failure-url: ${CONNECTION_FAILURE_URL:http://127.0.0.1:1}
