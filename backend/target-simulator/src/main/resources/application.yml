server:
  port: 8081
spring:
  application:
    name: target-simulator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interfaceflow}
    username: ${DB_USER:interfaceflow}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    table: flyway_target_history
    default-schema: target
    create-schemas: true
mybatis:
  mapper-locations: classpath:mappers/*.xml
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: logstash
lab:
  simulations-enabled: ${SIMULATIONS_ENABLED:true}
